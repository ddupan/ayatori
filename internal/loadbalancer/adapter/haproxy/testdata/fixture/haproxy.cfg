# 集成测试 fixture 的初始配置；userlist 凭据与测试中的 fixtureUser/fixturePassword 相同，只用于测试。
global
    master-worker
    stats socket /var/run/haproxy.sock mode 600 level admin expose-fd listeners
    hard-stop-after 30s

defaults
    mode tcp
    timeout connect 5s
    timeout client 1m
    timeout server 1m

userlist dataplaneapi
    user admin insecure-password AYATORI-TEST-ONLY
