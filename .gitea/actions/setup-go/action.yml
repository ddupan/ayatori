name: Setup Go
description: 各 Go job 共用的准备步骤：Go 工具链与依赖走 Artifact Keeper（云端 runner 走公共源），缓存 Go 模块、构建缓存与 bin 工具
inputs:
  cloud:
    description: 云端 runner（runs-on 含 cloud）连不上内网 Artifact Keeper，工具链与模块改走公共源
    default: 'false'
  docker:
    description: Docker Hub 镜像也走 Artifact Keeper（集成测试的后端容器）
    default: 'false'
  lint:
    description: 恢复并保存 golangci-lint 的分析缓存（lint job 用）
    default: 'false'
runs:
  using: composite
  steps:
    # Go 工具链与模块走 Artifact Keeper 的 pull-through 缓存，不直连外网。
    - uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
      if: inputs.cloud != 'true'
      with:
        go: 'true'
        go-version-file: go.mod
        docker: ${{ inputs.docker }}

    # 云端 runner：工具链与模块走 go.dev 和 proxy.golang.org。缓存仍由下面的 actions/cache 负责。
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      if: inputs.cloud == 'true'
      with:
        go-version-file: go.mod
        cache: false

    # 代替 setup-go 的缓存；bin 里的工具（envtest 二进制、golangci-lint）直接从 GitHub 下载，一并缓存。
    # 各 job 编译的包与构建标签不同，按 job 分开缓存。缓存只在 job 成功时保存，
    # go.sum/Makefile 变化后用 restore-keys 先恢复上一份再增量构建，避免冷缓存全量编译。
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
          bin
        key: go-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile') }}
        restore-keys: go-${{ github.workflow }}-${{ github.job }}-

    # lint 大部分时间花在分析上，这份缓存不在 go-build 里。按 commit 写新条目，下一次提交才能
    # 从上一次恢复、只重新分析改动的包。hash 部分不能省：golangci-lint 用版本、配置和 go.mod
    # 给缓存加盐，三者任一变化，旧条目都不会命中，恢复也没用。
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      if: inputs.lint == 'true'
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.mod', '.golangci.yml', 'Makefile') }}-${{ github.sha }}
        restore-keys: golangci-lint-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.mod', '.golangci.yml', 'Makefile') }}-
