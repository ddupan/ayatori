name: Verify

on:
  # 合并前完成全量验证，合并到 main 后不重复运行同一套检查。
  # 只改文档、部署 role/Flux 清单、Release 或安全扫描工作流时不运行；deploy/** 由 Deploy 工作流检查。
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/**'
      - '.gitea/workflows/release.yml'
      - '.gitea/workflows/deploy.yml'
      - '.gitea/workflows/security-scan.yml'
  workflow_dispatch:

# 同一 PR 推新提交时取消旧的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # envtest 与 golangci-lint 走 Artifact Keeper 的缓存，不直连 GitHub。
  GITHUB_RELEASES: https://artifacts.lab.ddupan.top/api/v1/repositories/github-releases/download

# test 与 lint 都在云端池（GKE Autopilot，gitea-dynamic-runner 的 cloud-scheduler）运行：不需要 Docker 和内网。
# 云端连不上内网：envtest 与 golangci-lint 直接从 GitHub release 下载，在 job 级覆盖上面的 Artifact Keeper 前缀。
jobs:
  test:
    runs-on: [cloud]
    env:
      GITHUB_RELEASES: https://github.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.gitea/actions/setup-go
        with:
          cloud: 'true'

      - name: Verify generated files and tests
        run: |
          make test
          git diff --exit-code

      # make test 已完成 manifests/generate/fmt/vet，这里直接编译，不再经 make build 重跑一遍。
      - name: Build controller entrypoint
        run: |
          go build -o bin/manager cmd/main.go
          ./bin/manager --help

  lint:
    runs-on: [cloud]
    env:
      GITHUB_RELEASES: https://github.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.gitea/actions/setup-go
        with:
          lint: 'true'
          cloud: 'true'

      - name: Lint
        run: make lint
