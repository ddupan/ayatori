name: Verify

on:
  # 合并前完成全量验证，合并到 main 后不重复运行同一套检查。
  # 只改文档、部署 role/Flux 清单、Release 或安全扫描工作流时不运行；deploy/** 由 Deploy 工作流检查。
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/**'
      - '.gitea/workflows/release.yml'
      - '.gitea/workflows/deploy.yml'
      - '.gitea/workflows/security-scan.yml'
  workflow_dispatch:

# 同一 PR 推新提交时取消旧的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: [self-hosted, pod]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.gitea/actions/setup-go

      - name: Verify generated files and tests
        run: |
          make test
          git diff --exit-code

      # make test 已完成 manifests/generate/fmt/vet，这里直接编译，不再经 make build 重跑一遍。
      - name: Build controller entrypoint
        run: |
          go build -o bin/manager cmd/main.go
          ./bin/manager --help

  lint:
    runs-on: [self-hosted, pod]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.gitea/actions/setup-go

      - name: Lint
        run: make lint
