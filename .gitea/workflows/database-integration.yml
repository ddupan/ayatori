name: Database Integration

on:
  # 只在 Database 相关代码或本工作流变化时运行真实后端集成测试；其余 Go 改动由 Verify 覆盖。
  # bootstrap 的集成测试同时验证 Database 装配，因此一并触发；其中只属于 LoadBalancer 装配的文件除外。
  pull_request:
    paths:
      - 'api/database/**'
      - 'internal/database/**'
      - 'internal/infra/**'
      - 'internal/bootstrap/**'
      - '!internal/bootstrap/loadbalancer*.go'
      - 'internal/testenv/**'
      - 'hack/integration-test.sh'
      - 'hack/apiserver/**'
      - '.gitea/workflows/database-integration.yml'
      - '.gitea/actions/setup-go/**'
  workflow_dispatch:

# 同一 PR 推新提交时取消旧的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # envtest 与 golangci-lint 走 Artifact Keeper 的缓存，不直连 GitHub。
  GITHUB_RELEASES: https://artifacts.lab.ddupan.top/api/v1/repositories/github-releases/download

jobs:
  lint:
    runs-on: [self-hosted, pod]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.gitea/actions/setup-go
        with:
          lint: 'true'

      - name: Lint integration build
        run: make lint-database-integration

  test:
    runs-on: [self-hosted, pod]
    timeout-minutes: 60  # 2 核 runner 冷缓存全量编译很慢；缓存只在成功时保存
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub 镜像（集成测试的后端容器）同样走 Artifact Keeper。
      - name: Set up Go
        uses: ./.gitea/actions/setup-go
        with:
          docker: 'true'

      # Runner 提供本 job 可用的 Docker；workflow 只验证，不重复启动 daemon。
      - name: Verify Docker availability
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Server={{.ServerVersion}} StorageDriver={{.Driver}}'

      - name: Test Database integration with real backends
        run: make test-database-integration
