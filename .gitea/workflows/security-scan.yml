# 安全扫描（ci-actions/security-scan），报告模式：发现只在 PR 上评论，不阻塞合并。
# 仓库级排除与误报处理写在各工具自己的文件里（.semgrepignore、.gitleaksignore、trivy.yaml、.trivyignore）。
name: Security Scan

on:
  pull_request:
  schedule:
    # 依赖漏洞随时间出现，与 PR 无关；每周全量扫一次，结果写 job 日志。
    - cron: '17 3 * * 1'
  workflow_dispatch:

# 同一 PR 推新提交时取消旧的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-scan:
    # 云端池（GKE Autopilot）：扫描器直接装在 runner 上，不需要 Docker 和内网。
    runs-on: [cloud]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Security scan
        uses: https://git.ddupan.top/panxiao81/ci-actions/security-scan@v1
        with:
          cloud: 'true'
          semgrep-config: p/default p/golang
