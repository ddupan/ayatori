name: Compute Integration

on:
  # 只在 Compute 相关代码或本工作流变化时，以 envtest 与真实的 libvirt（进程内 test 驱动）验证 Compute Agent。
  pull_request:
    paths:
      - 'api/compute/**'
      - 'internal/compute/**'
      - 'cmd/compute-agent/**'
      - '.gitea/workflows/compute-integration.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: [self-hosted, pod]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # Go 工具链与模块走 Artifact Keeper 的 pull-through 缓存，不直连外网。
      - name: Use Artifact Keeper caches
        uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
        with:
          go: 'true'
          go-version-file: go.mod

      # 代替 setup-go 的缓存；bin 里的工具（envtest 二进制、golangci-lint 自定义构建）直接从 GitHub 下载，一并缓存。
      - name: Cache Go modules, build cache and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            bin
          key: go-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile', '.custom-gcl.yml') }}

      # Compute Agent 经 cgo 链接 libvirt，编译、测试与 lint 都需要其开发包。
      - name: Install libvirt development files
        shell: bash
        run: |
          set -euo pipefail
          sudo_cmd=""
          if [ "$(id -u)" != 0 ]; then sudo_cmd=sudo; fi
          $sudo_cmd apt-get update -qq
          DEBIAN_FRONTEND=noninteractive $sudo_cmd apt-get install -y -qq --no-install-recommends gcc libc6-dev pkg-config libvirt-dev

      - name: Lint integration build
        run: make lint-compute-integration

  test:
    runs-on: [self-hosted, pod]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # Go 工具链与模块走 Artifact Keeper 的 pull-through 缓存，不直连外网。
      - name: Use Artifact Keeper caches
        uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
        with:
          go: 'true'
          go-version-file: go.mod

      # 代替 setup-go 的缓存；bin 里的工具（envtest 二进制、golangci-lint 自定义构建）直接从 GitHub 下载，一并缓存。
      - name: Cache Go modules, build cache and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            bin
          key: go-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile', '.custom-gcl.yml') }}

      # Compute Agent 经 cgo 链接 libvirt，编译、测试与 lint 都需要其开发包。
      - name: Install libvirt development files
        shell: bash
        run: |
          set -euo pipefail
          sudo_cmd=""
          if [ "$(id -u)" != 0 ]; then sudo_cmd=sudo; fi
          $sudo_cmd apt-get update -qq
          DEBIAN_FRONTEND=noninteractive $sudo_cmd apt-get install -y -qq --no-install-recommends gcc libc6-dev pkg-config libvirt-dev

      - name: Test Compute Agent with envtest and libvirtd
        run: make test-compute-integration
