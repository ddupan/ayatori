name: Deploy

on:
  # 只检查部署 role；Go 代码由 Verify 负责，Flux 清单在 Dev 同步时验证。
  pull_request:
    paths:
      - 'deploy/**'
      - '.gitea/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: [self-hosted, pod]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install tools
        run: |
          python3 -m pip install --user --break-system-packages --quiet uv==0.11.7
          export PATH="$HOME/.local/bin:$PATH"
          uv tool install --quiet ansible-lint
          uv tool install --quiet ansible-core

      - name: ansible-lint
        working-directory: deploy/ansible
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible-lint --nocolor -f pep8
