name: Release

on:
  # 版本 tag 是 Dev/Prod 共用的制品：Flux 同步该 tag 的清单，manager 镜像以同名 tag 发布。
  push:
    tags: ['v*']

jobs:
  # job id 是 SPIFFE ID 的一部分：zot 只授权
  # spiffe://ddupan.top/ci/panxiao81/ayatori/publish-image 写入 panxiao81/ayatori-manager。
  publish-image:
    runs-on: [self-hosted, pod]
    timeout-minutes: 30
    env:
      REGISTRY: zot.lab.ddupan.top
      IMAGE_REPOSITORY: panxiao81/ayatori-manager
      SPIRE_AGENT_SOCKET: /run/spire/agent-sockets/spire-agent.sock
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 基础镜像与构建内的 go mod download 走 Artifact Keeper 的 pull-through 缓存。
      - name: Use Artifact Keeper caches
        uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
        with:
          go: 'true'
          docker: 'true'

      # 与其他仓库相同：runner 提供 dockerd，buildx 以 docker-container driver 构建并附带 provenance/SBOM。
      - name: Build and publish image
        id: image
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          set +x
          docker info >/dev/null
          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'docker buildx rm ci-builder >/dev/null 2>&1 || true; rm -rf -- "$DOCKER_CONFIG"' EXIT
          /opt/spire/bin/spire-agent api fetch jwt -audience zot -socketPath "$SPIRE_AGENT_SOCKET" -output json |
            jq -er '.[0].svids[0].svid' | docker login "$REGISTRY" --username zot --password-stdin
          docker buildx create --name ci-builder --driver docker-container --use >/dev/null
          docker buildx build --platform linux/amd64 \
            --tag "${REGISTRY}/${IMAGE_REPOSITORY}:${TAG}" \
            --build-arg GOPROXY --build-arg GOPRIVATE \
            --provenance=mode=max --sbom=true \
            --metadata-file metadata.json --push .
          image="${REGISTRY}/${IMAGE_REPOSITORY}@$(jq -er '."containerimage.digest"' metadata.json)"
          echo "ayatori_image: $image"
          printf '## Published image\n\n- `%s`\n- tag `%s`, source `%s`\n' "$image" "$TAG" "$GITHUB_SHA" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      # 发布说明取自 annotated tag 的说明；同名 tag 重发时更新已有 Release。
      - name: Publish release notes
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.image }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # %(contents) 含签名 tag 的 PGP 签名块；只取标题与正文。
          notes="$(git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG")"
          body="$(printf '%s\n\n## 制品\n\n- manager 镜像：`%s`\n- Flux 清单：本 tag 的 `deploy/flux`\n' "$notes" "$IMAGE")"
          payload="$(jq -n --arg tag "$TAG" --arg body "$body" '{tag_name: $tag, name: $tag, body: $body, prerelease: ($tag | test("-"))}')"
          auth=(-H "Authorization: token ${TOKEN}" -H 'Content-Type: application/json')
          id="$(curl -fsS "${auth[@]}" "${API}/releases/tags/${TAG}" 2>/dev/null | jq -r '.id // empty' || true)"
          if [ -n "$id" ]; then
            curl -fsS -X PATCH "${auth[@]}" -d "$payload" "${API}/releases/${id}" > /dev/null
          else
            curl -fsS -X POST "${auth[@]}" -d "$payload" "${API}/releases" > /dev/null
          fi

  # LB agent 跑在 LB 主机上而不是 k8s 里，以 release 附件发布：homelab-cookbooks 的
  # verified_release 按同一 release 中的 checksums 校验 tarball 后安装（与 lego、dataplaneapi 相同）。
  publish-lb-agent:
    # 等 publish-image 建好带发布说明的 Release 再附加，避免两个 job 同时创建同名 Release。
    needs: publish-image
    runs-on: [self-hosted, pod]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.gitea/actions/setup-go

      - name: Build tarball and checksums
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          dist="$(mktemp -d)"
          mkdir "$dist/pkg"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o "$dist/pkg/lb-agent" ./cmd/lb-agent
          tar -C "$dist/pkg" -czf "$dist/ayatori-lb-agent_${version}_linux_amd64.tar.gz" lb-agent
          (cd "$dist" && sha256sum "ayatori-lb-agent_${version}_linux_amd64.tar.gz" > "ayatori_${version}_checksums.txt")
          echo "DIST=$dist" >> "$GITHUB_ENV"

      # tag 推送不会自动创建 release；已有同名 release 时附加到它上面。
      - name: Attach to release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +x
          api="${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}"
          auth="Authorization: token ${TOKEN}"
          if ! id="$(curl -fsS -H "$auth" "$api/releases/tags/$TAG" | jq -er .id)"; then
            id="$(jq -n --arg tag "$TAG" '{tag_name: $tag, name: $tag}' |
              curl -fsS -X POST -H "$auth" -H 'Content-Type: application/json' -d @- "$api/releases" | jq -er .id)"
          fi
          for file in "$DIST"/*.tar.gz "$DIST"/*_checksums.txt; do
            curl -fsS -X POST -H "$auth" -F "attachment=@${file}" "$api/releases/${id}/assets?name=$(basename "$file")" >/dev/null
          done
          printf '## LB agent\n\n- `%s/releases/download/%s/`\n' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" "$TAG" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
