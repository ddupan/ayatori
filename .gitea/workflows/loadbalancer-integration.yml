name: LoadBalancer Integration

on:
  # 只在 LoadBalancer 相关代码或本工作流变化时，以真实 HAProxy + Data Plane API 与进程内 GoBGP（LB agent 与对端）验证。
  pull_request:
    paths:
      - 'api/network/**'
      - 'internal/loadbalancer/**'
      - 'cmd/lb-agent/**'
      - 'internal/testenv/**'
      - 'hack/integration-test.sh'
      - '.gitea/workflows/loadbalancer-integration.yml'
      - '.gitea/actions/setup-go/**'
  workflow_dispatch:

# 同一 PR 推新提交时取消旧的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # envtest 与 golangci-lint 走 Artifact Keeper 的缓存，不直连 GitHub。
  GITHUB_RELEASES: https://artifacts.lab.ddupan.top/api/v1/repositories/github-releases/download

jobs:
  # lint 在云端池（GKE Autopilot）运行，不需要 Docker 和内网；golangci-lint 直接从 GitHub release 下载，
  # 在 job 级覆盖上面的 Artifact Keeper 前缀。test 要起 Docker 后端容器，留在 homelab。
  lint:
    runs-on: [cloud]
    env:
      GITHUB_RELEASES: https://github.com
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.gitea/actions/setup-go
        with:
          lint: 'true'
          cloud: 'true'

      - name: Lint integration build
        run: make lint-loadbalancer-integration

  test:
    runs-on: [self-hosted, pod]
    timeout-minutes: 60  # 2 核 runner 冷缓存全量编译很慢；缓存只在成功时保存
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Docker Hub 镜像（集成测试的后端容器）同样走 Artifact Keeper。
      - name: Set up Go
        uses: ./.gitea/actions/setup-go
        with:
          docker: 'true'

      # Runner 提供本 job 可用的 Docker；workflow 只验证，不重复启动 daemon。
      - name: Verify Docker availability
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Server={{.ServerVersion}} StorageDriver={{.Driver}}'

      - name: Test LoadBalancer integration with real backends
        run: make test-loadbalancer-integration
