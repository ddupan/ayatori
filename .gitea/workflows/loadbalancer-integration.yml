name: LoadBalancer Integration

on:
  # 只在 LoadBalancer 相关代码或本工作流变化时，以真实 HAProxy + Data Plane API 与进程内 GoBGP（LB agent 与对端）验证。
  pull_request:
    paths:
      - 'api/network/**'
      - 'internal/loadbalancer/**'
      - 'cmd/lb-agent/**'
      - '.gitea/workflows/loadbalancer-integration.yml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: [self-hosted, pod]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # Go 工具链与模块走 Artifact Keeper 的 pull-through 缓存，不直连外网。
      - name: Use Artifact Keeper caches
        uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
        with:
          go: 'true'
          go-version-file: go.mod

      # 代替 setup-go 的缓存；bin 里的工具（envtest 二进制、golangci-lint 自定义构建）直接从 GitHub 下载，一并缓存。
      - name: Cache Go modules, build cache and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            bin
          key: go-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile', '.custom-gcl.yml') }}

      - name: Lint integration build
        run: make lint-loadbalancer-integration

  test:
    runs-on: [self-hosted, pod]
    timeout-minutes: 60  # 冷缓存 + -race 全量编译就要 ~25 分钟；缓存只在成功时保存
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      # Go 工具链与模块、Docker Hub 镜像走 Artifact Keeper 的 pull-through 缓存，不直连外网。
      - name: Use Artifact Keeper caches
        uses: https://git.ddupan.top/panxiao81/ci-actions/setup-artifact-keeper@v1
        with:
          go: 'true'
          go-version-file: go.mod
          docker: 'true'

      # 代替 setup-go 的缓存；bin 里的工具（envtest 二进制、golangci-lint 自定义构建）直接从 GitHub 下载，一并缓存。
      - name: Cache Go modules, build cache and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
            bin
          key: go-${{ github.workflow }}-${{ github.job }}-${{ hashFiles('go.sum', 'Makefile', '.custom-gcl.yml') }}

      # Runner 提供本 job 可用的 Docker；workflow 只验证，不重复启动 daemon。
      - name: Verify Docker availability
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Server={{.ServerVersion}} StorageDriver={{.Driver}}'

      - name: Test LoadBalancer integration with real backends
        run: make test-loadbalancer-integration
