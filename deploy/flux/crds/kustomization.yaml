- ../../../config/crd/bases/network.ayatori.ddupan.top_loadbalancers.yaml
- ../../../config/crd/bases/network.ayatori.ddupan.top_loadbalancerhosts.yaml
- ../../../config/crd/bases/network.ayatori.ddupan.top_backends.yaml
- ../../../config/crd/bases/compute.ayatori.ddupan.top_libvirtnetworks.yaml
- ../../../config/crd/bases/compute.ayatori.ddupan.top_libvirtstoragepools.yaml
- ../../../config/crd/bases/compute.ayatori.ddupan.top_libvirtdomains.yaml
