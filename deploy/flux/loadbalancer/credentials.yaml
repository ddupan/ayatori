# controller 的 LB 凭据 Secret（--loadbalancer-credentials），只剩一项（ADR-0022：manager 不再连接
# LB 主机，Data Plane API 的客户端证书、服务端 CA 与 Basic 凭据都已撤掉）：
#   powerdns-api-key PowerDNS API key，manager 以 --loadbalancer-dns-* 维护 Hostname 时使用；
#                    位置由部署方给出（POWERDNS_API_KEY_PATH/PROPERTY）。
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: loadbalancer
  namespace: ayatori-system
spec:
  provider:
    vault:
      server: ${OPENBAO_ADDRESS}
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: ${OPENBAO_KUBERNETES_MOUNT}
          role: ${OPENBAO_EXTERNAL_SECRETS_ROLE}
          serviceAccountRef:
            name: external-secrets-openbao-login
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loadbalancer-credentials
  namespace: ayatori-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: loadbalancer
    kind: SecretStore
  target:
    name: loadbalancer-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        powerdns-api-key: "{{ .powerdns_api_key }}"
  data:
  - secretKey: powerdns_api_key
    remoteRef:
      key: ${POWERDNS_API_KEY_PATH}
      property: ${POWERDNS_API_KEY_PROPERTY}
