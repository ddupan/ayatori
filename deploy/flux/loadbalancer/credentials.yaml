# controller 的 LB 凭据 Secret（--loadbalancer-credentials）：
#   tls.crt/tls.key  Data Plane API 客户端证书，由本环境独立的根 pki-loadbalancer-<env> 签发，
#                    3 天寿命，每天重签；manager 热加载。
#   ca.crt           Data Plane API 服务端 CA（LB 主机证书经 pki/ 的 ACME 签发）。
#   username/password Data Plane API Basic；LB 主机只持有其哈希。
#   powerdns-api-key PowerDNS API key，manager 以 --loadbalancer-dns-* 维护 Hostname 时使用；
#                    位置由部署方给出（POWERDNS_API_KEY_PATH/PROPERTY）。
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: loadbalancer
  namespace: ayatori-system
spec:
  provider:
    vault:
      server: ${OPENBAO_ADDRESS}
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: ${OPENBAO_KUBERNETES_MOUNT}
          role: ${OPENBAO_EXTERNAL_SECRETS_ROLE}
          serviceAccountRef:
            name: external-secrets-openbao-login
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: loadbalancer-client-certificate
  namespace: ayatori-system
spec:
  path: /pki-loadbalancer-${AYATORI_ENVIRONMENT}/issue/ayatori
  method: POST
  parameters:
    common_name: ayatori-${AYATORI_ENVIRONMENT}-controller
  provider:
    server: ${OPENBAO_ADDRESS}
    auth:
      kubernetes:
        mountPath: ${OPENBAO_KUBERNETES_MOUNT}
        role: ${OPENBAO_EXTERNAL_SECRETS_ROLE}
        serviceAccountRef:
          name: external-secrets-openbao-login
---
# pki/cert/ca 无需授权；经 generator 读取只为与证书一起写入同一个 Secret。
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: loadbalancer-server-ca
  namespace: ayatori-system
spec:
  path: /pki/cert/ca
  method: GET
  provider:
    server: ${OPENBAO_ADDRESS}
    auth:
      kubernetes:
        mountPath: ${OPENBAO_KUBERNETES_MOUNT}
        role: ${OPENBAO_EXTERNAL_SECRETS_ROLE}
        serviceAccountRef:
          name: external-secrets-openbao-login
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loadbalancer-credentials
  namespace: ayatori-system
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: loadbalancer
    kind: SecretStore
  target:
    name: loadbalancer-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
        ca.crt: "{{ .server_ca_certificate }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
        powerdns-api-key: "{{ .powerdns_api_key }}"
  data:
  - secretKey: username
    remoteRef:
      key: infra/loadbalancer/${AYATORI_ENVIRONMENT}
      property: username
  - secretKey: password
    remoteRef:
      key: infra/loadbalancer/${AYATORI_ENVIRONMENT}
      property: password
  - secretKey: powerdns_api_key
    remoteRef:
      key: ${POWERDNS_API_KEY_PATH}
      property: ${POWERDNS_API_KEY_PROPERTY}
  dataFrom:
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: loadbalancer-client-certificate
  - sourceRef:
      generatorRef:
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: VaultDynamicSecret
        name: loadbalancer-server-ca
    rewrite:
    - regexp: {source: "(.*)", target: "server_ca_$1"}
