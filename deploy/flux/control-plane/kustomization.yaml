# ${VAR} 由环境的 Flux Kustomization postBuild.substitute 提供（见 deploy/<env>/vars.yml）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../../config/rbac/role.yaml
- rbac.yaml
- version.yaml
- postgresql.yaml
# 节点 agent 的权限（ADR-0021、ADR-0022）：只有 RBAC 与准入策略，没有节点加入时不起作用。
- ../nodes
- ../compute
