- name: 重启 k0s
  ansible.builtin.systemd_service:
    name: k0scontroller
    state: restarted

- name: 重启控制面容器
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: [external-secrets, flux-source-controller, flux-kustomize-controller, ayatori-manager]
