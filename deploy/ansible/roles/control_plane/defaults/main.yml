# 对外接口：部署方只声明环境与该环境的 PostgreSQL 实例，其余均由本 role 推导。
#   ayatori_environment: dev | prod
#   ayatori_postgresql_instance: {name, host, hostaddr, port}
#   ayatori_gitops（可选）: {url, path, branch=main}，Flux 同步其中的 namespace、Tenant 与 Database
# 站点端点（openbao_address、ayatori_repository、ayatori_image 的 registry）只是默认值，部署方
# 可覆盖；Flux 清单中的环境相关值一律经 postBuild 替换，改地址不需要发版。
# 本 role 与 manager 镜像、Flux 清单同属一个 release；版本随 release 提交更新，
# Release 工作流校验它与 galaxy.yml、git tag 一致。
ayatori_version: v0.2.0
# 完全不可用的 release 不升版本而是重发同名 tag，部署时重新拉取并按镜像 ID 变化重启。
ayatori_image: zot.lab.ddupan.top/panxiao81/ayatori-manager:{{ ayatori_version }}

ayatori_api_address: "{{ ansible_default_ipv4.address }}"
ayatori_api_sans: ["{{ ansible_host | default(inventory_hostname) }}"]

openbao_kubernetes_mount: kubernetes-ayatori-{{ ayatori_environment }}
openbao_controller_role: ayatori-{{ ayatori_environment }}-controller
openbao_external_secrets_role: ayatori-{{ ayatori_environment }}-external-secrets
database_credential_prefix: ayatori/{{ ayatori_environment }}/applications
management_credential_path: infra/postgresql/ayatori/{{ ayatori_environment }}

# 两个环境共用的第三方组件版本；升级在 Dev 验证后随同一提交进入 Prod。
k0s_version: v1.36.4+k0s.1
k0s_sha256: 18c304d53cdd70095e99c6b859b269b4fef0bb84579d7e7185271a9135694a31
# 只保留 apiserver、etcd、只开 namespace 控制器的 kube-controller-manager 与 k0s 自身 RBAC。
# k0s 默认 etcd=info 且输出自身 gRPC 客户端 info 日志，约占控制面日志量九成，持续写 journald。
k0s_controller_flags:
  - --logging=etcd=warn
  - --verbose=false
k0s_disabled_components:
  - autopilot
  - control-api
  - coredns
  - csr-approver
  - endpoint-reconciler
  - helm
  - konnectivity-server
  - kube-proxy
  - kube-scheduler
  - metrics-server
  - network-provider
  - node-role
  - update-prober
  - windows-node

# 第三方镜像固定 digest；CRD 清单固定 sha256，与镜像版本一起升级。
eso_version: v2.11.0
eso_image: ghcr.io/external-secrets/external-secrets@sha256:66fb710878cbf3eba4a927e35c5d75e29a202c9bab238aad64bfb23b786b962b
eso_manifest_sha256: c427124642886d240af8f28d294714a168d920ef8e5d55db14600e00ed0cfb80
flux_version: v1.9.6
flux_source_image: ghcr.io/fluxcd/source-controller@sha256:6a6693172589f8ff26123a231d5fa6ceb194a6efb4dc647cdf057c959f76a2e3
flux_kustomize_image: ghcr.io/fluxcd/kustomize-controller@sha256:2ebeaa341da77d52b6abbbba5efcee0450d47f8b42f0e6f33b08f9020262d606
flux_crds:
  - name: source-controller
    sha256: 5acf3b01c24f15647a162f2d43b1287f0d0156fab0026f4afb9865874cdbe16d
  - name: kustomize-controller
    sha256: b9e74622f9f3d87950f59641651fe0ea0220367c1d6f34a72c9591552afda292

ksm_image: registry.k8s.io/kube-state-metrics/kube-state-metrics@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
# node_exporter 以二进制运行：容器内重新挂载的 procfs 没有 LXCFS 覆盖，会读到宿主数据。
node_exporter_version: 1.12.1
node_exporter_sha256: b51d8a76aa2a9156a55d501aca6276fae09e262259a5e4e831d2c2222f084e63
node_exporter_textfile_dir: /var/lib/node-exporter/textfile

ayatori_repository: https://git.ddupan.top/panxiao81/ayatori.git
openbao_address: https://bao.lab.ddupan.top:8200
control_namespace: ayatori-system
deploy_state_dir: /var/lib/ayatori-deploy
# 部署方须把独立卷挂载到此处（homelab-infra 为 Incus custom volume）。
backup_dir: /var/backups/ayatori
backup_keep: 7
# 每个集群外进程一个 k0s 证书用户；uid 是镜像内的运行用户，kubeconfig 只对其可读。
identities_dir: /etc/ayatori-control-plane
identities:
  - {name: ayatori-controller, uid: 65532}
  - {name: external-secrets, uid: 65534}
  - {name: flux-source-controller, uid: 65534}
  - {name: flux-kustomize-controller, uid: 65534}
  - {name: kube-state-metrics, uid: 65534}
