- name: 安装 podman
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: 创建身份目录
  ansible.builtin.file:
    path: "{{ identities_dir }}/{{ item.name }}"
    state: directory
    owner: "{{ item.uid }}"
    group: "{{ item.uid }}"
    mode: "0500"
  loop: "{{ identities }}"

# ponytail: k0s 签发的客户端证书一年到期；到期前删除对应 kubeconfig 并重跑 playbook 轮换。
- name: 签发 kubeconfig
  ansible.builtin.shell: |
    set -eu
    umask 077
    k0s kubeconfig create "$NAME" > "$DIR/kubeconfig.tmp"
    chown "$ID:$ID" "$DIR/kubeconfig.tmp"
    chmod 0400 "$DIR/kubeconfig.tmp"
    mv "$DIR/kubeconfig.tmp" "$DIR/kubeconfig"
  args:
    creates: "{{ identities_dir }}/{{ item.name }}/kubeconfig"
  environment:
    NAME: "{{ item.name }}"
    ID: "{{ item.uid }}"
    DIR: "{{ identities_dir }}/{{ item.name }}"
  loop: "{{ identities }}"
  notify: 重启控制面容器

- name: 创建 kube-state-metrics 配置目录
  ansible.builtin.file:
    path: "{{ identities_dir }}/kube-state-metrics-config"
    state: directory
    owner: "65534"
    group: "65534"
    mode: "0500"

- name: 写入 kube-state-metrics 自定义资源配置
  ansible.builtin.copy:
    src: custom-resource-state.yaml
    dest: "{{ identities_dir }}/kube-state-metrics-config/custom-resource-state.yaml"
    owner: "65534"
    group: "65534"
    mode: "0400"
  notify: 重启控制面容器

# 公开中央 CA，仅用于 PostgreSQL verify-full；OpenBao 使用系统信任根。
- name: 获取 PostgreSQL 中央 CA
  ansible.builtin.get_url:
    url: "{{ openbao_address }}/v1/pki/ca/pem"
    dest: "{{ identities_dir }}/ayatori-controller/postgresql-ca.crt"
    owner: "65532"
    mode: "0444"
  notify: 重启控制面容器

# 同名 tag 可能被重发：每次部署重新拉取，镜像 ID 变化时重启。
- name: 拉取控制面镜像
  ansible.builtin.shell: |
    set -eu
    before=$(podman image inspect --format '{{ "{{.Id}}" }}' "$IMAGE" 2>/dev/null || true)
    podman pull -q "$IMAGE" >/dev/null
    after=$(podman image inspect --format '{{ "{{.Id}}" }}' "$IMAGE")
    [ "$before" = "$after" ] || echo changed
  environment:
    IMAGE: "{{ item.image }}"
  loop: "{{ containers }}"
  loop_control:
    label: "{{ item.name }}"
  register: image_pull
  changed_when: "'changed' in image_pull.stdout"
  notify: 重启控制面容器

- name: 写入 quadlet
  ansible.builtin.template:
    src: container.j2
    dest: /etc/containers/systemd/{{ item.name }}.container
    mode: "0644"
  loop: "{{ containers }}"
  loop_control:
    label: "{{ item.name }}"
  notify: 重启控制面容器

- name: 启动控制面容器
  ansible.builtin.systemd_service:
    name: "{{ item.name }}"
    state: started
    daemon_reload: true
  loop: "{{ containers }}"
  loop_control:
    label: "{{ item.name }}"
