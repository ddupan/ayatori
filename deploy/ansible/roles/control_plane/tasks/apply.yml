# 以 server-side apply 幂等应用一个清单；diff 无差异时跳过。namespace 等依赖尚不存在时
# diff 会失败，此时直接 apply，由 apply 报告真实错误。
- name: 比较 {{ manifest | basename }}
  ansible.builtin.command: k0s kubectl diff --server-side --force-conflicts -f {{ manifest }}
  register: manifest_diff
  changed_when: false
  failed_when: false

- name: 应用 {{ manifest | basename }}
  ansible.builtin.command: k0s kubectl apply --server-side --force-conflicts -f {{ manifest }}
  when: manifest_diff.rc != 0
  changed_when: true
