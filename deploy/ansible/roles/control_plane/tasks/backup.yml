# 备份写入部署方挂载的独立卷；未挂载时失败，避免备份静默落在容器 rootfs。
- name: 确认备份卷已挂载
  ansible.builtin.command: mountpoint -q {{ backup_dir }}
  changed_when: false

- name: 写入 k0s 备份 unit
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [ayatori-backup.service, ayatori-backup.timer]

- name: 启用 k0s 备份 timer
  ansible.builtin.systemd_service:
    name: ayatori-backup.timer
    enabled: true
    state: started
    daemon_reload: true
