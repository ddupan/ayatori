# 二选一：动态申请或显式引用已有 Database。凭据位置公布在 status，投射由消费方集群自行完成。
apiVersion: database.ayatori.ddupan.top/v1alpha1
kind: PostgreSQLTenant
metadata:
  name: new-app
  namespace: default
spec:
  provision:
    instanceRef:
      name: shared-postgres
    database: new_app
    loginRole: new_app
  extensions:
    - pgcrypto
---
apiVersion: database.ayatori.ddupan.top/v1alpha1
kind: PostgreSQLTenant
metadata:
  name: existing-app
  namespace: default
spec:
  databaseRef:
    name: imported-app
