---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: libvirtstoragevolumes.compute.ayatori.ddupan.top
spec:
  group: compute.ayatori.ddupan.top
  names:
    kind: LibvirtStorageVolume
    listKind: LibvirtStorageVolumeList
    plural: libvirtstoragevolumes
    singular: libvirtstoragevolume
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.libvirt.pool
      name: Pool
      type: string
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.path
      name: Path
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LibvirtStorageVolumeSpec 声明一个卷（ADR-0015）。卷由一种存储后端提供，各后端是 spec 下互斥的
              一块：本版本只有 libvirt（经 libvirt pool 管理）；ADR-0020 的 LINSTOR 以后作为并列的 linstor 加入。
              后端与 nodeName 创建后不可修改：卷的内容是数据，Ayatori 不会为了让配置一致而重建它。
              扩容（ADR-0019 §7）在后续版本加入。
            properties:
              libvirt:
                description: Libvirt 表示卷在 libvirt pool 中，由节点上的 Agent 经 libvirt 创建与删除。
                properties:
                  pool:
                    description: Pool 是 LibvirtStoragePool 的名字。
                    minLength: 1
                    type: string
                  xml:
                    description: |-
                      XML 是原生 volume XML，例如 <volume><capacity unit='G'>20</capacity><target><format type='qcow2'/></target></volume>。
                      name 由 Ayatori 填写为对象名，domain 因此可以用 <source pool='…' volume='对象名'/> 引用。
                      卷已存在时直接接管，不按 XML 修改或覆盖。
                    minLength: 1
                    type: string
                required:
                - pool
                - xml
                type: object
                x-kubernetes-validations:
                - message: libvirt volume is immutable
                  rule: self == oldSelf
              nodeName:
                description: |-
                  NodeName 表示卷只存在于该节点上（本地存储），引用它的实例只能在该节点运行。共享存储（rbd、
                  LINSTOR）以后不填。本版本只支持本地存储，必须指定。
                maxLength: 253
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: nodeName is immutable
                  rule: self == oldSelf
              reclaimPolicy:
                default: Retain
                description: ReclaimPolicy 决定删除对象时如何处理 libvirt 中的卷。
                enum:
                - Retain
                - Delete
                type: string
              source:
                description: Source 是卷创建时复制的内容；不写时是空卷。只在创建时生效，之后卷与来源无关。
                properties:
                  image:
                    description: Image 是 Disk 类型的 Image 的名字（ADR-0019 §9）。
                    minLength: 1
                    type: string
                required:
                - image
                type: object
                x-kubernetes-validations:
                - message: source is immutable
                  rule: self == oldSelf
            required:
            - nodeName
            type: object
            x-kubernetes-validations:
            - message: 'a storage backend must be set: libvirt'
              rule: has(self.libvirt)
            - message: storage backend is immutable
              rule: has(self.libvirt) == has(oldSelf.libvirt)
            - message: source is immutable
              rule: has(self.source) == has(oldSelf.source)
          status:
            properties:
              capacity:
                description: Capacity 是卷的容量（字节）。
                format: int64
                type: integer
              image:
                description: Image 与 SHA256 是卷实际复制的镜像及其版本。
                type: string
              message:
                description: Message 是最近一次创建失败的原因；成功时为空。
                type: string
              observedGeneration:
                format: int64
                type: integer
              path:
                description: Path 是卷在节点上的路径；为空表示尚未创建。
                type: string
              sha256:
                type: string
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.nodeName
    served: true
    storage: true
    subresources:
      status: {}
