---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: loadbalancers.network.ayatori.ddupan.top
spec:
  group: network.ayatori.ddupan.top
  names:
    kind: LoadBalancer
    listKind: LoadBalancerList
    plural: loadbalancers
    shortNames:
    - lb
    singular: loadbalancer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.hostname
      name: Hostname
      type: string
    - jsonPath: .status.conditions[?(@.type=='Programmed')].status
      name: Programmed
      type: string
    - jsonPath: .status.conditions[?(@.type=='EndpointsReady')].status
      name: EndpointsReady
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LoadBalancer 是 namespace 内消费方声明的 L4 入口。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoadBalancerSpec 声明一个 L4 TCP 入口：VIP 与各端口引用的 Backend。
            properties:
              address:
                description: Address 请求池内指定的 VIP；省略时自动分配。
                maxLength: 15
                type: string
                x-kubernetes-validations:
                - message: address must be a canonical IPv4 address
                  rule: isIP(self) && ip.isCanonical(self) && ip(self).family() ==
                    4
              ports:
                items:
                  description: LoadBalancerPort 是 VIP 上的一个 TCP 端口及其引用的 Backend，类似
                    Octavia listener。
                  properties:
                    backendRef:
                      description: BackendRef 引用同 namespace 的 Backend；不存在时该端口拒绝连接。
                      properties:
                        name:
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                          type: string
                      required:
                      - name
                      type: object
                    idleTimeout:
                      default: 1h
                      description: IdleTimeout 是客户端与后端两侧连接的空闲上限。
                      type: string
                    name:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                  required:
                  - backendRef
                  - port
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - port
                x-kubernetes-list-type: map
            required:
            - ports
            type: object
            x-kubernetes-validations:
            - message: address is immutable
              rule: has(self.address) == has(oldSelf.address) && (!has(self.address)
                || self.address == oldSelf.address)
          status:
            properties:
              address:
                description: Address 是已确认占用的 VIP；一经记录不再改变。
                maxLength: 15
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpoints:
                description: |-
                  Endpoints 是各端口的各成员在各主机上的健康检查结论，每个（端口、成员、主机）一项（ADR-0023）。
                  平铺而非嵌套：kube-state-metrics 的 custom resource state 只展开一层列表，嵌套的明细导不出指标。
                  观察不到的主机不列出。
                items:
                  description: |-
                    EndpointStatus 是一个端口的一个成员在一台主机上的检查结论，对应 HAProxy exporter 的
                    server_status、server_check_status 与 server_check_code。
                  properties:
                    address:
                      maxLength: 253
                      type: string
                    checkCode:
                      description: CheckCode 是 HTTP 检查的返回码；L4 检查没有。
                      format: int32
                      type: integer
                    checkStatus:
                      description: CheckStatus 是最近一次检查的结论，如 L4OK、L4CON、L4TOUT、L7OK、L7STS。
                      maxLength: 16
                      type: string
                    endpointPort:
                      format: int32
                      type: integer
                    host:
                      maxLength: 63
                      type: string
                    lastTransitionTime:
                      description: LastTransitionTime 是 State 最近一次变化的时间。
                      format: date-time
                      type: string
                    port:
                      description: Port 是 LoadBalancer 的端口。
                      format: int32
                      type: integer
                    state:
                      description: State 是 UP、DOWN、MAINT、DRAIN、NOLB 或 NOCHECK；翻转途中的「UP
                        1/3」记为 UP。
                      maxLength: 16
                      type: string
                  required:
                  - address
                  - endpointPort
                  - host
                  - lastTransitionTime
                  - port
                  - state
                  type: object
                maxItems: 4096
                type: array
                x-kubernetes-list-map-keys:
                - port
                - address
                - endpointPort
                - host
                x-kubernetes-list-type: map
              hostname:
                description: Hostname 是已确认指向 VIP 的 DNS 名称 <name>.<namespace>.<zone>；未启用
                  DNS 时为空。
                maxLength: 253
                type: string
              hosts:
                description: Hosts 是本轮在各 LB 主机上的落地进度，只呈现观察，不作为下一轮的依据。
                items:
                  properties:
                    message:
                      maxLength: 1024
                      type: string
                    name:
                      maxLength: 63
                      type: string
                    phase:
                      enum:
                      - Pending
                      - Configured
                      - Ready
                      - Removed
                      - Unavailable
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              ports:
                description: Ports 是各端口的可用成员数（ADR-0023）。
                items:
                  properties:
                    endpoints:
                      description: Endpoints 是引用的 Backend 中的成员数。
                      format: int32
                      type: integer
                    name:
                      maxLength: 63
                      type: string
                    port:
                      format: int32
                      type: integer
                    readyEndpoints:
                      description: ReadyEndpoints 是至少在一台主机上 UP 的成员数。
                      format: int32
                      type: integer
                  required:
                  - endpoints
                  - port
                  - readyEndpoints
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - port
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label because it becomes part of the hostname
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
        - message: recorded address cannot change or be removed
          rule: '!(has(oldSelf.status) && has(oldSelf.status.address)) || (has(self.status)
            && has(self.status.address) && self.status.address == oldSelf.status.address)'
    served: true
    storage: true
    subresources:
      status: {}
