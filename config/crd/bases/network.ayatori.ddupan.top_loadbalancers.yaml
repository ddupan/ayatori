---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: loadbalancers.network.ayatori.ddupan.top
spec:
  group: network.ayatori.ddupan.top
  names:
    kind: LoadBalancer
    listKind: LoadBalancerList
    plural: loadbalancers
    shortNames:
    - lb
    singular: loadbalancer
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .status.hostname
      name: Hostname
      type: string
    - jsonPath: .status.conditions[?(@.type=='Programmed')].status
      name: Programmed
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LoadBalancer 是 namespace 内消费方声明的 L4 入口。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoadBalancerSpec 声明一个 L4 TCP 入口：VIP 与各端口的后端集合、健康检查。
            properties:
              address:
                description: Address 请求池内指定的 VIP；省略时自动分配。
                maxLength: 15
                type: string
                x-kubernetes-validations:
                - message: address must be a canonical IPv4 address
                  rule: isIP(self) && ip.isCanonical(self) && ip(self).family() ==
                    4
              ports:
                items:
                  description: LoadBalancerPort 是 VIP 上的一个 TCP 端口及其后端集合，类似 Octavia
                    listener + pool。
                  properties:
                    drainTimeout:
                      default: 30s
                      description: |-
                        DrainTimeout 是 endpoint 被移出集合后保留已有连接的上限；超时后剩余连接由代理
                        旧 worker 服务至主机级 hard-stop-after。
                      type: string
                    endpoints:
                      description: Endpoints 由消费方整组替换；为空时该端口拒绝连接。
                      items:
                        description: Endpoint 是后端地址与端口；地址可以是 DNS 名称，由数据面周期解析。
                        properties:
                          address:
                            maxLength: 253
                            minLength: 1
                            type: string
                            x-kubernetes-validations:
                            - message: address must be an IP address or a DNS name
                              rule: isIP(self) || self.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$')
                          port:
                            format: int32
                            maximum: 65535
                            minimum: 1
                            type: integer
                        required:
                        - address
                        - port
                        type: object
                      maxItems: 64
                      type: array
                      x-kubernetes-list-map-keys:
                      - address
                      - port
                      x-kubernetes-list-type: map
                    healthCheck:
                      default:
                        healthyThreshold: 2
                        interval: 5s
                        timeout: 3s
                        type: TCP
                        unhealthyThreshold: 3
                      description: HealthCheck 省略时以 TCP 探测各 endpoint 自身端口。默认值写全：apiserver
                        校验默认值时不展开嵌套默认。
                      properties:
                        expectedStatuses:
                          description: ExpectedStatuses 省略时期望 200。
                          items:
                            format: int32
                            maximum: 599
                            minimum: 100
                            type: integer
                          maxItems: 8
                          type: array
                          x-kubernetes-list-type: set
                        healthyThreshold:
                          default: 2
                          format: int32
                          maximum: 10
                          minimum: 1
                          type: integer
                        interval:
                          default: 5s
                          type: string
                          x-kubernetes-validations:
                          - message: interval must be at least 1s
                            rule: duration(self) >= duration('1s')
                        path:
                          maxLength: 1024
                          pattern: ^/
                          type: string
                        port:
                          description: Port 覆盖探测端口；省略时使用各 endpoint 自身端口。
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        timeout:
                          default: 3s
                          type: string
                          x-kubernetes-validations:
                          - message: timeout must be at least 1s
                            rule: duration(self) >= duration('1s')
                        type:
                          default: TCP
                          enum:
                          - TCP
                          - HTTP
                          type: string
                        unhealthyThreshold:
                          default: 3
                          format: int32
                          maximum: 10
                          minimum: 1
                          type: integer
                      type: object
                      x-kubernetes-validations:
                      - message: path is required for HTTP and not allowed for TCP
                          checks
                        rule: 'self.type == ''HTTP'' ? has(self.path) : !has(self.path)
                          && !has(self.expectedStatuses)'
                      - message: timeout must not exceed interval
                        rule: duration(self.timeout) <= duration(self.interval)
                    idleTimeout:
                      default: 1h
                      description: IdleTimeout 是客户端与后端两侧连接的空闲上限。
                      type: string
                    name:
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    proxyProtocol:
                      default: None
                      description: ProxyProtocol 向后端发送 PROXY 头以传递客户端地址；健康检查同样携带。
                      enum:
                      - None
                      - V1
                      - V2
                      type: string
                  required:
                  - port
                  type: object
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - port
                x-kubernetes-list-type: map
            required:
            - ports
            type: object
            x-kubernetes-validations:
            - message: address is immutable
              rule: has(self.address) == has(oldSelf.address) && (!has(self.address)
                || self.address == oldSelf.address)
          status:
            properties:
              address:
                description: Address 是已确认占用的 VIP；一经记录不再改变。
                maxLength: 15
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              hostname:
                description: Hostname 是已确认指向 VIP 的 DNS 名称 <name>.<namespace>.<zone>；未启用
                  DNS 时为空。
                maxLength: 253
                type: string
              hosts:
                description: Hosts 是本轮在各 LB 主机上的落地进度，只呈现观察，不作为下一轮的依据。
                items:
                  properties:
                    message:
                      maxLength: 1024
                      type: string
                    name:
                      maxLength: 63
                      type: string
                    phase:
                      enum:
                      - Pending
                      - Configured
                      - Ready
                      - Removed
                      - Unavailable
                      type: string
                  required:
                  - name
                  - phase
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label because it becomes part of the hostname
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
        - message: recorded address cannot change or be removed
          rule: '!(has(oldSelf.status) && has(oldSelf.status.address)) || (has(self.status)
            && has(self.status.address) && self.status.address == oldSelf.status.address)'
    served: true
    storage: true
    subresources:
      status: {}
