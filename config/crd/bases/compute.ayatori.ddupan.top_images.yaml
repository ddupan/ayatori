---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: images.compute.ayatori.ddupan.top
spec:
  group: compute.ayatori.ddupan.top
  names:
    kind: Image
    listKind: ImageList
    plural: images
    singular: image
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.pool
      name: Pool
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ImageSpec 声明每个选中节点上都要有一份的只读内容（ADR-0019 §9）。副本是 pool 中与对象同名的文件。
            properties:
              nodeSelector:
                additionalProperties:
                  type: string
                description: NodeSelector 按 Node 的 label 选择节点；为空时是所有计算节点。
                type: object
              pool:
                description: Pool 是各节点上的 LibvirtStoragePool，必须是 dir 类型：副本靠 rename
                  原子替换。
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: pool is immutable
                  rule: self == oldSelf
              source:
                description: ImageSource 是镜像的来源。修改即更新镜像。
                properties:
                  http:
                    description: ImageHTTPSource 从 HTTP(S) 下载镜像，应指向内网镜像 bucket：家宽上联不稳定。
                    properties:
                      sha256:
                        description: SHA256 是镜像内容的校验和，同时标识版本。
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      url:
                        pattern: ^https?://
                        type: string
                    required:
                    - sha256
                    - url
                    type: object
                type: object
                x-kubernetes-validations:
                - message: 'an image source must be set: http'
                  rule: has(self.http)
              type:
                description: ImageType 表示镜像的内容，决定谁能使用它（ADR-0019 §9）。
                enum:
                - Disk
                - ISO
                type: string
                x-kubernetes-validations:
                - message: type is immutable
                  rule: self == oldSelf
            required:
            - pool
            - source
            - type
            type: object
          status:
            properties:
              nodes:
                items:
                  description: ImageNodeStatus 是一个节点上的副本。
                  properties:
                    message:
                      description: Message 是下载进度或最近一次失败的原因。
                      type: string
                    nodeName:
                      type: string
                    observedGeneration:
                      format: int64
                      type: integer
                    ready:
                      description: Ready 表示现有副本与 spec 的版本一致。
                      type: boolean
                    sha256:
                      description: SHA256 是本节点现有副本的版本；为空表示还没有副本。
                      type: string
                  required:
                  - nodeName
                  - ready
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - nodeName
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
