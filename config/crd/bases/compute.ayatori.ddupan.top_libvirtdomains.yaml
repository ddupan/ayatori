---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: libvirtdomains.compute.ayatori.ddupan.top
spec:
  group: compute.ayatori.ddupan.top
  names:
    kind: LibvirtDomain
    listKind: LibvirtDomainList
    plural: libvirtdomains
    singular: libvirtdomain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LibvirtDomainSpec 按归属拆开：引用 Ayatori 对象的设备是类型化字段，其余是原生 domain
              XML（ADR-0015）。
            properties:
              disks:
                description: Disks 按顺序渲染为 <disk>。
                items:
                  description: DomainDisk 是实例的一块磁盘，由 Ayatori 渲染为 <disk>（ADR-0015）。
                  properties:
                    bootOrder:
                      description: BootOrder 是启动顺序，从 1 开始；不写表示不从这块盘启动。与 domainXML
                        中 <os><boot> 不能同时使用。
                      format: int32
                      minimum: 1
                      type: integer
                    bus:
                      default: virtio
                      description: DiskBus 是磁盘接在客户机的哪种总线上。fdc 渲染为软驱。
                      enum:
                      - virtio
                      - scsi
                      - sata
                      - ide
                      - fdc
                      type: string
                    image:
                      description: Image 是 ISO 类型的 Image 的名字，作为只读光驱挂载。副本更新后，下次启动读到新版本（ADR-0019
                        §9）。
                      minLength: 1
                      type: string
                    readOnly:
                      type: boolean
                    volume:
                      description: Volume 是本节点上 LibvirtStorageVolume 的名字。
                      minLength: 1
                      type: string
                  type: object
                  x-kubernetes-validations:
                  - message: exactly one of volume and image must be set
                    rule: has(self.volume) != has(self.image)
                  - message: 'an image is a cdrom: bus must be sata, scsi or ide'
                    rule: '!has(self.image) || self.bus in [''sata'', ''scsi'', ''ide'']'
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              domainXML:
                description: |-
                  DomainXML 是原生 domain XML，不含 Ayatori 拥有的元素：<name>、<uuid>、<disk>、<interface>、<tpm>，
                  以及 <os> 的 firmware 属性、<firmware>、<loader>、<nvram>。
                  这些元素出现时 Agent 拒绝下发并在 status 中说明。其余内容原样透传。
                minLength: 1
                type: string
              firmware:
                description: Firmware 不写时使用 libvirt 的默认固件（x86 上是 BIOS）。
                properties:
                  secureBoot:
                    type: boolean
                  tpm:
                    description: TPM 给实例一个 TPM 2.0。
                    type: boolean
                  type:
                    description: FirmwareType 是实例的固件。
                    enum:
                    - BIOS
                    - UEFI
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: secureBoot requires UEFI
                  rule: '!(has(self.secureBoot) && self.secureBoot) || self.type ==
                    ''UEFI'''
              interfaces:
                description: Interfaces 按顺序渲染为 <interface>。
                items:
                  description: DomainInterface 是实例的一块网卡，由 Ayatori 渲染为 <interface>（ADR-0015）。
                  properties:
                    mac:
                      description: MAC 地址。不写时由 Ayatori 从对象 UID 稳定生成；冷启动换节点后不变。
                      pattern: ^[0-9a-fA-F]{2}(:[0-9a-fA-F]{2}){5}$
                      type: string
                    model:
                      default: virtio
                      description: Model 是网卡型号，例如 virtio、e1000e、rtl8139。
                      minLength: 1
                      type: string
                    network:
                      description: Network 是 LibvirtNetwork 的名字。
                      minLength: 1
                      type: string
                  required:
                  - network
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-type: atomic
              nodeName:
                description: NodeName 是运行实例的节点。本版本只支持显式指定，候选节点与冷切换在后续版本加入。
                maxLength: 253
                minLength: 1
                type: string
              runState:
                default: Running
                description: |-
                  RunState 只表示创建后与宿主机重启后是否应当拉起实例，不表示任何时候都必须在运行：
                  客户机内关机或运维人员关机都是有意的停止（ADR-0015）。
                enum:
                - Running
                - Stopped
                type: string
            required:
            - domainXML
            - nodeName
            type: object
          status:
            properties:
              message:
                description: Message 是最近一次下发或启动失败的原因；成功时为空。
                type: string
              nodeName:
                description: NodeName 是实际定义了该实例的节点。
                type: string
              observedGeneration:
                format: int64
                type: integer
              reason:
                type: string
              state:
                description: State 与 Reason 是 libvirt 报告的状态与原因，例如 running/booted、shutoff/shutdown。
                type: string
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.nodeName
    served: true
    storage: true
    subresources:
      status: {}
