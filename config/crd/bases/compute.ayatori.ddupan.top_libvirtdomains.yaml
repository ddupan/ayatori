              interfaces:
                description: Interfaces 按 alias 绑定网络；顺序决定端口名，增删中间的项会改变后面网卡的端口名。
                items:
                  description: |-
                    DomainInterface 把 LibvirtNetwork 绑定到 domain 中 alias 相同的网卡（ADR-0026）。Ayatori 按它填写该网卡的
                    source 与 target（端口名）；mac 不写时由对象 UID 稳定生成。
                  properties:
                    alias:
                      description: Alias 是 domain 中网卡的 alias.name，libvirt 要求以 ua-
                        开头。
                      maxLength: 64
                      pattern: ^ua-[A-Za-z0-9_-]+$
                      type: string
                    network:
                      description: Network 是 LibvirtNetwork 的名字。
                      maxLength: 253
                      minLength: 1
                      type: string
                  required:
                  - alias
                  - network
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - alias
                x-kubernetes-list-type: map
              nodeName:
                description: NodeName 是运行实例的节点。本版本只支持显式指定，候选节点与冷切换在后续版本加入。
                maxLength: 253
                minLength: 1
                type: string
              runState:
                default: Running
                description: |-
                  RunState 只表示创建后与宿主机重启后是否应当拉起实例，不表示任何时候都必须在运行：
                  客户机内关机或运维人员关机都是有意的停止（ADR-0015）。
                enum:
                - Running
                - Stopped
                type: string
            required:
            - domain
            - nodeName
            type: object
            x-kubernetes-validations:
            - message: domain.name, domain.uuid and domain.metadata are set by Ayatori
              rule: '!has(self.domain.name) && !has(self.domain.uuid) && !has(self.domain.metadata)'
            - message: 'disk source, backingStore, mirror and driver.type are set
                by Ayatori: bind a volume or image in spec.disks'
              rule: '!has(self.domain.devices) || !has(self.domain.devices.disks)
                || self.domain.devices.disks.all(d, !has(d.source) && !has(d.backingStore)
                && !has(d.mirror) && (!has(d.driver) || !has(d.driver.type)))'
            - message: every interface must be bound to a network in spec.interfaces
                by its alias; source and target are set by Ayatori
              rule: '!has(self.domain.devices) || !has(self.domain.devices.interfaces)
                || self.domain.devices.interfaces.all(i, !has(i.source) && !has(i.target)
                && has(i.alias) && has(self.interfaces) && self.interfaces.exists(b,
                b.alias == i.alias.name))'
            - message: firmware state (os.nvRam, os.loader.path) is placed by Ayatori
              rule: '!has(self.domain.os) || (!has(self.domain.os.nvRam) && (!has(self.domain.os.loader)
                || !has(self.domain.os.loader.path)))'
            - message: vTPM state (backend.emulator.source) is placed by Ayatori
              rule: '!has(self.domain.devices) || !has(self.domain.devices.tpms) ||
                self.domain.devices.tpms.all(t, !has(t.backend) || !has(t.backend.emulator)
                || !has(t.backend.emulator.source))'
            - message: VNC and SPICE listen on a local unix socket set by Ayatori
              rule: '!has(self.domain.devices) || !has(self.domain.devices.graphics)
                || self.domain.devices.graphics.all(g, (!has(g.vnc) || !(has(g.vnc.socket)
                || has(g.vnc.port) || has(g.vnc.autoPort) || has(g.vnc.webSocket)
                || has(g.vnc.listen) || has(g.vnc.listeners))) && (!has(g.spice) ||
                !(has(g.spice.port) || has(g.spice.tlsPort) || has(g.spice.autoPort)
                || has(g.spice.listen) || has(g.spice.listeners))))'
            - message: every spec.disks alias must name a disk in domain.devices.disks
              rule: '!has(self.disks) || self.disks.all(b, has(self.domain.devices)
                && has(self.domain.devices.disks) && self.domain.devices.disks.exists(d,
                has(d.alias) && d.alias.name == b.alias))'
            - message: every spec.interfaces alias must name an interface in domain.devices.interfaces
              rule: '!has(self.interfaces) || self.interfaces.all(b, has(self.domain.devices)
                && has(self.domain.devices.interfaces) && self.domain.devices.interfaces.exists(i,
                has(i.alias) && i.alias.name == b.alias))'
          status:
            properties:
              message:
                description: Message 是最近一次下发或启动失败的原因；成功时为空。
                type: string
              nodeName:
                description: NodeName 是实际定义了该实例的节点。
                type: string
              observedGeneration:
                format: int64
                type: integer
              reason:
                type: string
              state:
                description: State 与 Reason 是 libvirt 报告的状态与原因，例如 running/booted、shutoff/shutdown。
                type: string
            type: object
        required:
        - spec
        type: object
