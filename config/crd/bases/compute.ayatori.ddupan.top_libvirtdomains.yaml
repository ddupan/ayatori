---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: libvirtdomains.compute.ayatori.ddupan.top
spec:
  group: compute.ayatori.ddupan.top
  names:
    kind: LibvirtDomain
    listKind: LibvirtDomainList
    plural: libvirtdomains
    singular: libvirtdomain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nodeName
      name: Node
      type: string
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .status.reason
      name: Reason
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              domainXML:
                description: |-
                  DomainXML 是原生 domain XML，`virsh dumpxml` 的输出可以直接使用。name 与 uuid 由 Ayatori 填写；
                  <source pool='…' volume='…'/> 由 Agent 解析为具体路径后再下发（AppArmor 不认 pool 卷引用）。
                minLength: 1
                type: string
              nodeName:
                description: NodeName 是运行实例的节点。本版本只支持显式指定，候选节点与冷切换在后续版本加入。
                maxLength: 253
                minLength: 1
                type: string
              runState:
                default: Running
                description: |-
                  RunState 只表示创建后与宿主机重启后是否应当拉起实例，不表示任何时候都必须在运行：
                  客户机内关机或运维人员关机都是有意的停止（ADR-0015）。
                enum:
                - Running
                - Stopped
                type: string
            required:
            - domainXML
            - nodeName
            type: object
          status:
            properties:
              message:
                description: Message 是最近一次下发或启动失败的原因；成功时为空。
                type: string
              nodeName:
                description: NodeName 是实际定义了该实例的节点。
                type: string
              observedGeneration:
                format: int64
                type: integer
              reason:
                type: string
              state:
                description: State 与 Reason 是 libvirt 报告的状态与原因，例如 running/booted、shutoff/shutdown。
                type: string
            type: object
        required:
        - spec
        type: object
    selectableFields:
    - jsonPath: .spec.nodeName
    served: true
    storage: true
    subresources:
      status: {}
