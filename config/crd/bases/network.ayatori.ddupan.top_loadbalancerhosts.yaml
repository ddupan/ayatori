---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: loadbalancerhosts.network.ayatori.ddupan.top
spec:
  group: network.ayatori.ddupan.top
  names:
    kind: LoadBalancerHost
    listKind: LoadBalancerHostList
    plural: loadbalancerhosts
    shortNames:
    - lbhost
    singular: loadbalancerhost
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dataPlaneURL
      name: Data Plane
      type: string
    - jsonPath: .status.conditions[?(@.type=='DataPlaneReachable')].status
      name: Reachable
      type: string
    - jsonPath: .status.conditions[?(@.type=='AgentReady')].status
      name: Agent
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LoadBalancerHost 是一台 LB 主机；每个 LoadBalancer 落地到全部 LoadBalancerHost。由部署方创建，
          删除时先清理该主机上全部 LoadBalancer 配置。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              LoadBalancerHostSpec 指向一台 LB 主机上的 Data Plane API（ADR-0015）。凭据按环境统一，留在
              controller 的凭据 Secret，资源里只有地址。
            properties:
              agentURL:
                description: AgentURL 是该主机 LB agent 指标端口的地址，controller 读取其只读的 GET
                  /status。
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - message: agentURL must be an http or https URL
                  rule: isURL(self) && url(self).getScheme() in ['http', 'https']
              dataPlaneURL:
                description: DataPlaneURL 是该主机 Data Plane API 的 HTTPS 地址，controller
                  以 mTLS 与 Basic 凭据访问。
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - message: dataPlaneURL must be an https URL
                  rule: isURL(self) && url(self).getScheme() == 'https'
            required:
            - agentURL
            - dataPlaneURL
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration 是本 status 观察的 spec 版本。
                format: int64
                type: integer
              vips:
                description: |-
                  VIPs 是 agent 最近一次报告的每个 VIP 是否已发给路由器；agent 不应答时清空。只呈现观察，
                  LoadBalancer 的 Attachment 以它为准。
                items:
                  properties:
                    address:
                      maxLength: 15
                      type: string
                    announced:
                      type: boolean
                    reason:
                      description: Reason 是未宣告的原因：not-local、frontend-not-open 或 not-advertised。
                      maxLength: 64
                      type: string
                  required:
                  - address
                  - announced
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - address
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label because it appears in LoadBalancer status
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources:
      status: {}
