---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: loadbalancerhosts.network.ayatori.ddupan.top
spec:
  group: network.ayatori.ddupan.top
  names:
    kind: LoadBalancerHost
    listKind: LoadBalancerHostList
    plural: loadbalancerhosts
    shortNames:
    - lbhost
    singular: loadbalancerhost
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.dataPlaneURL
      name: Data Plane
      type: string
    - jsonPath: .status.conditions[?(@.type=='DataPlaneReachable')].status
      name: Reachable
      type: string
    - jsonPath: .status.conditions[?(@.type=='AgentReady')].status
      name: Agent
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          LoadBalancerHost 是一台 LB 主机；每个 LoadBalancer 落地到全部 LoadBalancerHost。由该主机的 agent
          以与 Node 同名注册并写入 status（ADR-0022）；删除由管理员发起，先清理该主机上全部 LoadBalancer
          配置。退役时先停 agent，否则它会重新注册。
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LoadBalancerHostSpec 由管理员持有，agent 只读（ADR-0022）。
            properties:
              dataPlaneURL:
                description: |-
                  DataPlaneURL 是该主机 Data Plane API 的 HTTPS 地址，controller 以 mTLS 与 Basic 凭据访问。
                  ponytail: 迁移期间 manager 仍远程收敛时使用（ADR-0022「下线与迁移」）；agent 在本机收敛后删除。
                maxLength: 253
                type: string
                x-kubernetes-validations:
                - message: dataPlaneURL must be an https URL
                  rule: isURL(self) && url(self).getScheme() == 'https'
            type: object
          status:
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              loadBalancers:
                description: |-
                  LoadBalancers 是 agent 在本机收敛各 LoadBalancer 的结果（ADR-0022）：每个 LoadBalancer 一项，
                  controller 据此汇总 LoadBalancer 的 status。对象删除完成后移除该项。
                items:
                  description: HostLoadBalancerStatus 是一个 LoadBalancer 在本机的代理配置事实。
                  properties:
                    digest:
                      description: |-
                        Digest 是本机配置文件与之完全一致的期望配置摘要；不一致时为空。controller 以同一算法计算
                        期望的摘要并比较，Backend 变化不改变 LoadBalancer 的 generation，所以不用 generation。
                      maxLength: 64
                      type: string
                    message:
                      description: Message 是 reload 失败或无法观察本机代理时的说明。
                      maxLength: 1024
                      type: string
                    name:
                      maxLength: 63
                      type: string
                    namespace:
                      maxLength: 63
                      type: string
                    present:
                      description: Present 表示本机存在属于该 LoadBalancer 的任何配置。
                      type: boolean
                    reload:
                      description: Reload 是本机最近一次 reload 的结果：Succeeded、Pending 或 Failed。
                      enum:
                      - Succeeded
                      - Pending
                      - Failed
                      type: string
                    servers:
                      description: Servers 是运行中的进程里各 server 的健康检查结论（ADR-0023）。
                      items:
                        properties:
                          address:
                            maxLength: 253
                            type: string
                          checkCode:
                            format: int32
                            type: integer
                          checkStatus:
                            maxLength: 16
                            type: string
                          endpointPort:
                            format: int32
                            type: integer
                          port:
                            description: Port 是 LoadBalancer 的端口。
                            format: int32
                            type: integer
                          state:
                            maxLength: 16
                            type: string
                        required:
                        - address
                        - endpointPort
                        - port
                        - state
                        type: object
                      maxItems: 1024
                      type: array
                      x-kubernetes-list-map-keys:
                      - port
                      - address
                      - endpointPort
                      x-kubernetes-list-type: map
                    uid:
                      description: UID 区分同名重建的对象：本机配置按 UID 命名。
                      maxLength: 36
                      type: string
                  required:
                  - name
                  - namespace
                  - present
                  - reload
                  - uid
                  type: object
                maxItems: 1024
                type: array
                x-kubernetes-list-map-keys:
                - namespace
                - name
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration 是本 status 观察的 spec 版本。
                format: int64
                type: integer
              vips:
                description: |-
                  VIPs 是 agent 报告的每个 VIP 是否已发给路由器；agent 的 Lease 过期时由 controller 清空。
                  只呈现观察，LoadBalancer 的 Attachment 以它为准。
                items:
                  properties:
                    address:
                      maxLength: 15
                      type: string
                    announced:
                      type: boolean
                    reason:
                      description: Reason 是未宣告的原因：not-local、frontend-not-open 或 not-advertised。
                      maxLength: 64
                      type: string
                  required:
                  - address
                  - announced
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - address
                x-kubernetes-list-type: map
            type: object
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label because it appears in LoadBalancer status
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$') && size(self.metadata.name)
            <= 63
    served: true
    storage: true
    subresources:
      status: {}
