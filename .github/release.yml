# GitHub 自动生成发布说明的分组（release-please 的 changelog-type: github 调用同一个 API）：
# 每个合并的 PR 一条，以 PR 标题为准；dev/<feature> 分支合入 main 只算一条，分支上的提交历史保留。
changelog:
  exclude:
    labels:
      - "autorelease: pending"
      - "autorelease: tagged"
  categories:
    - title: 依赖更新
      labels:
        - dependencies
    - title: 变更
      labels:
        - "*"
