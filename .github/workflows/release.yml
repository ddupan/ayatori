name: Release

on:
  # 版本 tag 是 Dev/Prod 共用的制品：Flux 同步该 tag 的清单，manager 镜像以同名 tag 发布。
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # GitHub 托管 runner：构建 manager 镜像推到 ghcr（带 provenance/SBOM），构建节点 agent，
  # 以 annotated tag 的说明创建 GitHub Release 并附上 agent。不需要内网。
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write   # GitHub Release
      packages: write   # ghcr
    outputs:
      digest: ${{ steps.image.outputs.digest }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ayatori-manager
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      - name: Build and push image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          docker buildx create --name ci-builder --driver docker-container --use >/dev/null
          docker buildx build --platform linux/amd64 --tag "${IMAGE}:${TAG}" \
            --build-arg "VERSION=${TAG}" \
            --provenance=mode=max --sbom=true --metadata-file metadata.json --push .
          digest="$(jq -er '."containerimage.digest"' metadata.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf '## Published image\n\n- `%s@%s`\n' "$IMAGE" "$digest" >> "$GITHUB_STEP_SUMMARY"

      # 节点 agent 跑在主机上而不是 k8s 里，以 release 附件发布：homelab-cookbooks 的
      # verified_release 按同一 release 中的 checksums 校验 tarball 后安装（与 lego、dataplaneapi 相同）。
      - name: Build agent tarballs
        run: |
          set -euo pipefail
          version="${TAG#v}"
          mkdir -p dist/pkg
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/pkg/lb-agent ./cmd/lb-agent
          # compute-agent 经 cgo 动态链接 libvirt.so.0 与 liblxc（ADR-0015），只能在不比节点新的 glibc 与
          # libvirt 上构建。runner 的 Ubuntu 会随 Renovate 升级，因此在与节点相同的 Debian 13 里构建；
          # Go 版本取自 go.mod，随工具链一起升级。
          docker run --rm -v "$PWD:/src" -w /src -e CGO_ENABLED=1 "golang:$(go mod edit -json | jq -er .Go)-trixie" sh -ec '
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends pkg-config lxc-dev libvirt-dev >/dev/null
            go build -buildvcs=false -trimpath -o dist/pkg/compute-agent ./cmd/compute-agent'
          # imds 单独发布：PVE 宿主机也部署它，不需要 compute-agent（ADR-0016）。
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/pkg/imds ./cmd/imds
          tar -C dist/pkg -czf "dist/ayatori-lb-agent_${version}_linux_amd64.tar.gz" lb-agent
          tar -C dist/pkg -czf "dist/ayatori-compute-agent_${version}_linux_amd64.tar.gz" compute-agent
          tar -C dist/pkg -czf "dist/ayatori-imds_${version}_linux_amd64.tar.gz" imds

      # 人用的 CLI（ADR-0027）：Linux 与 macOS 的压缩包，版本写进 `ayatori --version`。
      - name: Build CLI tarballs
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${platform%/*}" arch="${platform#*/}"
            out="dist/cli/${os}_${arch}"
            mkdir -p "$out"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X main.version=${TAG}" \
              -o "$out/ayatori" ./cmd/ayatori
            tar -C "$out" -czf "dist/ayatori_${version}_${os}_${arch}.tar.gz" ayatori
          done

      - name: Checksums
        run: (cd dist && sha256sum -- *.tar.gz > "ayatori_${TAG#v}_checksums.txt")

      # release-please 合并 release PR 时已建好 Release（说明即 CHANGELOG 的这一节）：保留它，只追加制品。
      # 手动推送的 tag 没有 Release：说明取自 annotated tag。附件同名覆盖，重跑幂等。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          git fetch --quiet --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          # %(contents) 含签名 tag 的签名块；只取标题与正文。
          artifacts="$(printf '## 制品\n\n- manager 镜像：`%s@%s`（内网 `zot.lab.ddupan.top/panxiao81/ayatori-manager@%s`）\n- Flux 清单：本 tag 的 `deploy/flux`\n- CLI：`ayatori_<版本>_<os>_<arch>.tar.gz`（Linux、macOS），校验和见 `*_checksums.txt`\n' \
            "$IMAGE" "$DIGEST" "$DIGEST")"
          prerelease=(); [[ "$TAG" == *-* ]] && prerelease=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            # 重跑时替换上一次追加的制品一节（digest 可能变了）。
            gh release view "$TAG" --json body -q .body | sed '/^## 制品$/,$d' > notes.md
            printf '\n%s\n' "$artifacts" >> notes.md
            gh release edit "$TAG" --notes-file notes.md "${prerelease[@]}"
          else
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > notes.md
            printf '\n%s\n' "$artifacts" >> notes.md
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file notes.md "${prerelease[@]}"
          fi
          gh release upload "$TAG" dist/*.tar.gz dist/*_checksums.txt --clobber

  # homelab ARC runner：Dev/Prod 从内网 zot 拉取，zot 只在内网、按 SPIFFE ID 授权。按 digest 原样
  # 复制 ghcr 上的镜像（含 provenance/SBOM），不重新构建。SPIFFE ID（…/ayatori/publish-image）来自
  # spire-identity-exchange；homelab-infra platform/spire/github-ci.yaml 的 entry 只匹配本文件的 tag push。
  publish-image:
    needs: build
    runs-on: homelab
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read    # 新建的 ghcr package 默认私有，复制前也要能读到
      id-token: write   # GitHub OIDC token, one half of the exchange's proof
    steps:
      - id: svid
        uses: ddupan/ci-actions/spiffe-jwt-svid@v1
        with:
          audience: zot
      - name: Copy image to zot
        env:
          SVID: ${{ steps.svid.outputs.svid }}
          GH_TOKEN: ${{ github.token }}
          SOURCE: ghcr.io/${{ github.repository_owner }}/ayatori-manager@${{ needs.build.outputs.digest }}
          TARGET: zot-push.lab.ddupan.top/panxiao81/ayatori-manager:${{ github.ref_name }}
        run: |
          set -euo pipefail
          export DOCKER_CONFIG
          DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf -- "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin >/dev/null
          printf '%s' "$SVID" | docker login zot-push.lab.ddupan.top --username zot --password-stdin >/dev/null
          docker buildx imagetools create --tag "$TARGET" "$SOURCE"
          # policy 按 digest 引用镜像：zot 上的 digest 必须与 ghcr 的相同。
          copied="$(docker buildx imagetools inspect "$TARGET" --format '{{json .Manifest}}' | jq -er .digest)"
          [ "$copied" = "${SOURCE#*@}" ] || { echo "digest changed in copy: $copied" >&2; exit 1; }
          printf '## zot\n\n- `zot.lab.ddupan.top/panxiao81/ayatori-manager@%s`\n' "$copied" >> "$GITHUB_STEP_SUMMARY"
