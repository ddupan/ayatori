name: Verify

on:
  # 合并前完成全量验证，合并到 main 后不重复运行同一套检查。
  # 只改文档、Flux 清单（deploy/**）或 Release 工作流时不运行；Flux 清单在 Dev 同步时验证。
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'deploy/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR 推新提交时取消旧的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# test 与 lint 在 GitHub 托管 runner 上运行：不需要内网；envtest 与 golangci-lint 从 GitHub release 下载。
jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      # Compute Agent 经 cgo 链接 libvirt，编译、测试与 lint 都需要其开发包。
      - name: Install libvirt development files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends gcc libc6-dev pkg-config lxc-dev libvirt-dev

      # make test 会重新生成 CRD/deepcopy；Data Plane API 客户端不在其中，单独生成后一并检查。
      - name: Verify generated files and tests
        run: |
          make test generate-dataplaneapi
          git diff --exit-code

      # make test 已完成 manifests/generate/fmt/vet，这里直接编译，不再经 make build 重跑一遍。
      - name: Build controller entrypoint
        run: |
          go build -o bin/manager cmd/main.go
          ./bin/manager --help

  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          lint: 'true'

      # Compute Agent 经 cgo 链接 libvirt，编译、测试与 lint 都需要其开发包。
      - name: Install libvirt development files
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          DEBIAN_FRONTEND=noninteractive sudo apt-get install -y -qq --no-install-recommends gcc libc6-dev pkg-config lxc-dev libvirt-dev

      - name: Lint
        run: make lint
