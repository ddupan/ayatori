name: Claude Code Review

on:
  # 草稿 PR（如只为跑 CI 的 dev/* → main）不审，转为 ready 时再审。
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

# 同一 PR 推新提交时取消旧的审查。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    # bot 的 PR 不审：Renovate 的依赖升级由 CI 验证，release-please 的 release PR 只改版本与发布说明。
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.type != 'Bot' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write   # claude-code-action 以 OIDC 换取 Claude GitHub App 的 token 来发评论
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Review
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}'
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
