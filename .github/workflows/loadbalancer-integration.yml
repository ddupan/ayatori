name: LoadBalancer Integration

on:
  # 只在 LoadBalancer 相关代码或本工作流变化时，以真实 HAProxy + Data Plane API 与进程内 GoBGP（LB agent 与对端）验证。
  pull_request:
    paths:
      - 'api/network/**'
      - 'internal/loadbalancer/**'
      - 'cmd/lb-agent/**'
      - 'internal/testenv/**'
      - 'hack/integration-test.sh'
      - '.github/workflows/loadbalancer-integration.yml'
      - '.github/actions/setup-go/**'
  workflow_dispatch:

permissions:
  contents: read

# 同一 PR 推新提交时取消旧的运行。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 都在 GitHub 托管 runner 上运行：自带 Docker，后端容器直接从 Docker Hub 拉取，不需要内网。
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          lint: 'true'

      - name: Lint integration build
        run: make lint-loadbalancer-integration

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60  # 冷缓存全量编译较慢；缓存只在成功时保存
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: ./.github/actions/setup-go

      # 托管 runner 自带 Docker；这里只确认可用。
      - name: Verify Docker availability
        shell: bash
        run: |
          set -euo pipefail
          docker version
          docker info --format 'Server={{.ServerVersion}} StorageDriver={{.Driver}}'

      - name: Test LoadBalancer integration with real backends
        run: make test-loadbalancer-integration
